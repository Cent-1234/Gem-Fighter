<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gem Fighter</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js"></script>
    <link rel="icon" href="Images/logo.png" type="image/png" />
  </head>
  <body>
    <nav class="navbar">
        <!-- Hamburger menu for mobile, hidden on desktop by CSS -->
        <div class="hamburger-menu" id="hamburger-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

        <!-- Main navigation links -->
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="https://hodltoken.net/gem-fighter-p2e">Play & Earn</a></li>
            <li><a href="nfts.html">NFTs</a></li>
            <li><a href="story.html">Story</a></li>
        </ul>

        <!-- Single "Connect" button and social icons.
             Visibility and positioning controlled by CSS for desktop/mobile. -->
        <ul class="social-nav">
            <li><button id="connectWallet" class="cta-button walletconnect">Connect</button></li>
            
        </ul>
    </nav>

    <section id="supportSection" class="section">
      <div class="form-container">
        <div class="support-card">
          <h2 class="glowing-text">Contact Support</h2>
          <form
            id="contactForm"
            action="https://formspree.io/f/manojzqk"
            method="POST"
          >
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required />

            <label for="email">EMail:</label>
            <input type="email" id="email" name="email" required />

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button class="cta-button" type="submit">Send</button>
            <p
              id="formMessage"
              style="display: none; color: #00f3ff; margin-top: 1rem"
            ></p>
          </form>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-links">
          <a href="terms.html">Terms</a>
          <span class="link-separator">⏺</span>
          <a href="privacy.html">Privacy</a>
          <span class="link-separator">⏺</span>
          <a href="cookies.html">Cookies</a>
          <span class="link-separator">⏺</span>
          <a href="disclaimers.html">Disclaimers</a>
          <span class="link-separator">⏺</span>
          <a href="support.html">Support</a>
        </div>
        <br />

        <!-- Add social icons -->
        <div class="social-icons" style="margin: 1.5rem 0">
          <a
            href="https://x.com/GemFighterP2E"
            target="_blank"
            class="social-link"
          >
            <i class="fab fa-x-twitter"></i>
          </a>
          <a
            href="https://t.me/GemFighterP2E"
            target="_blank"
            class="social-link"
          >
            <i class="fab fa-telegram-plane"></i>
          </a>
        </div>

        <p class="footer-text">
          © 2025 GEM FIGHTER<br />
          SURVIVE → EARN → HODL
        </p>
      </div>
    </footer>

    <script>
      // Support Form
      const contactForm = document.getElementById('contactForm');
      const formMessage = document.getElementById('formMessage');

      contactForm.addEventListener('submit', function (e) {
        e.preventDefault();

        const formData = new FormData(contactForm);

        fetch(contactForm.action, {
          method: 'POST',
          body: formData,
          headers: {
            Accept: 'application/json',
          },
        })
          .then((response) => {
            if (response.ok) {
              formMessage.textContent =
                'Thank you! Your message has been sent.';
              formMessage.style.display = 'block';
              contactForm.reset();
            } else {
              response.json().then((data) => {
                formMessage.textContent = data.errors
                  ? data.errors[0].message
                  : 'Something went wrong. Please try again.';
                formMessage.style.display = 'block';
              });
            }
          })
          .catch((error) => {
            formMessage.textContent = 'Error: Could not send message.';
            formMessage.style.display = 'block';
          });
      });
    </script>
  </body>
  <script src="script.js"></script>
</html>
